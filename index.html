<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librarium - Recomendador Inteligente</title>
    <meta name="description" content="Encuentra tu próxima gran lectura con nuestro recomendador avanzado.">
    <link rel="icon" type="image/png" href="favicon.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=4">
</head>

<body>
    <!-- App Container -->
    <div class="app-container">

        <!-- Sidebar / Filters -->
        <aside class="sidebar">
            <div class="logo">
                <img src="favicon.png" alt="Logo" class="logo-icon">
                <h1>Librarium</h1>
            </div>

            <div class="filter-section">
                <h3>Búsqueda Mágica</h3>
                <input type="text" id="searchInput" placeholder="Ej: Magia, Tecnología, Amor..." autocomplete="off">
            </div>

            <div class="filter-section">
                <h3>Público Objetivo</h3>
                <select id="targetAgeFilter">
                    <option value="todos">Todos</option>
                    <option value="infantil">Infantil</option>
                    <option value="juvenil">Juvenil</option>
                    <option value="adulto">Adulto</option>
                </select>
            </div>

            <div class="filter-section">
                <h3>Géneros</h3>
                <div class="chip-group" id="genreFilters">
                    <!-- Filled by JS -->
                </div>
            </div>

            <div class="filter-section">
                <h3>Itinerarios Lectores</h3>
                <div class="itinerary-list" id="itineraryList">
                    <!-- Filled by JS -->
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <h2>Descubre tu próxima aventura</h2>
                <p>Explora nuestras recomendaciones basadas en tus gustos.</p>
            </header>

            <div class="book-grid" id="bookGrid">
                <!-- Book Cards filled by JS -->
            </div>
            
            <div class="load-more-container" id="loadMoreContainer" style="display: none;">
                <button id="loadMoreBtn" class="load-more-btn">Cargar más libros</button>
            </div>
        </main>
    </div>

    <!-- Book Detail Modal -->
    <div class="modal-overlay" id="bookModal">
        <div class="modal-content">
            <button class="close-modal" id="closeModal">&times;</button>
            <div class="modal-body" id="modalBody">
                <!-- Filled by JS -->
            </div>
        </div>
    </div>

    <script src="data.js?v=4"></script>
    <script src="app.js?v=4"></script>
</body>

</html>
